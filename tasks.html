<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage</title>

    <link rel="stylesheet" href="dashboard/assets/stylesheets/style.css">

    <script src="dashboard/assets/engines/engine.js" defer></script>
</head>
<body>
    <header class="dp-flex ai-center">
        <div class="brandmark">
            <h1>Tasks</h1>
        </div>
        <nav>
            <a href="" class="dp-flex ai-center jc-center" id="share-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Share
            </a>
        </nav>
    </header>
    <main>
        <article>
            <section class="tasks-board">
                <div class="board-header">
                    <h2>Project Tasks</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <span class="progress-text" id="progress-text">0% complete</span>
                </div>

                <form class="task-create" id="task-create">
                    <input type="text" name="title" id="task-title" placeholder="Task title" required>
                    <input type="text" name="assignee" id="task-assignee" placeholder="Assignee" required>
                    <input type="number" name="weight" id="task-weight" placeholder="Weight %" min="1" max="100" required>
                    <button type="submit">Add task</button>
                </form>

                <div class="board-columns" id="board-columns">
                    <div class="column" data-status="todo">
                        <h3>To Do</h3>
                    </div>
                    <div class="column" data-status="in_progress">
                        <h3>In Progress</h3>
                    </div>
                    <div class="column" data-status="done">
                        <h3>Done</h3>
                    </div>
                </div>
                <div class="task-actions">
                    <button type="button" id="export-json">Export JSON</button>
                    <label class="import-label">
                        Import JSON
                        <input type="file" id="import-json" accept=".json" hidden>
                    </label>
                </div>
            </section>
        </article>
        <!-- <aside></aside> -->
    </main>
    <footer></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Garage — Project Tasks Board</title>
        <meta name="description" content="Create weighted tasks, drag them across To Do, In Progress and Done, and track project progress in your browser.">
        <meta name="author" content="Fouad Salehi">
        <meta name="keywords" content="Garage, task board, kanban, weighted tasks, progress tracking, terminal, JSON export, offline task manager, browser task manager, project management, Fouad Salehi">
        <meta name="robots" content="index, follow">
        <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
        <link rel="canonical" href="https://fouadsgarage.github.io/garage/tasks">
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="apple-touch-icon" href="favicon.ico">

        <script>
            (function () {
                var theme = null;
                try { theme = localStorage.getItem('garage-theme'); } catch (e) {}
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
            })();
        </script>

        <link rel="stylesheet" href="dashboard/assets/stylesheets/style.css">
        <script src="dashboard/assets/engines/engine.js" defer></script>
    </head>
    <body>
        <header class="dp-flex ai-center">
            <div class="brandmark dp-flex ai-center">
                <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512" aria-hidden="true">
                    <path d="M112 400 V248 a144 144 0 0 1 288 0 V400 Z" fill="none" stroke="currentColor" stroke-width="28" stroke-linejoin="round"/>
                    <rect x="160" y="280" width="192" height="120" fill="none" stroke="currentColor" stroke-width="20"/>
                    <line x1="160" y1="320" x2="352" y2="320" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
                    <line x1="160" y1="360" x2="352" y2="360" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
                    <circle cx="176" cy="208" r="12" fill="currentColor"/>
                    <circle cx="336" cy="208" r="12" fill="currentColor"/>
                </svg>
                <h1>Dashboard</h1>
            </div>
            <nav>
                <a href="/garage" class="dp-flex ai-center jc-center" id="back-btn" aria-label="Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Back
                </a>
                <a href="" class="dp-flex ai-center jc-center" id="share-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                    </svg>
                    Share
                </a>
                <button type="button" id="theme-toggle" class="dp-flex ai-center jc-center" aria-label="Switch to dark theme" aria-pressed="false">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </nav>
        </header>
        <main>
            <article>
                <section class="route">
                    <p><a href="/garage">Garage</a> / <a href="/garage/tasks" aria-current="page">Tasks</a></p>
                </section>
                <section class="tasks-board">
                    <div class="board-header">
                        <h2>Project Tasks</h2>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                        </div>
                        <span class="progress-text" id="progress-text">0% complete</span>
                    </div>

                    <form class="task-create" id="task-create">
                        <input type="text" name="title" id="task-title" placeholder="Task title" required>
                        <input type="text" name="assignee" id="task-assignee" placeholder="Assignee" required>
                        <input type="number" name="weight" id="task-weight" placeholder="Weight %" min="1" max="100" required>
                        <button type="submit">Add task</button>
                        <button type="button" class="btn-cancel" id="task-cancel" hidden>Cancel</button>
                    </form>

                    <div class="task-extra" id="task-extra">
                        <input type="text" name="description" id="task-description" placeholder="Description (optional)">
                        <input type="date" name="due_date" id="task-due-date" placeholder="Due date">
                        <select name="priority" id="task-priority">
                            <option value="low">Low priority</option>
                            <option value="medium" selected>Medium priority</option>
                            <option value="high">High priority</option>
                            <option value="urgent">Urgent</option>
                        </select>
                        <input type="text" name="tags" id="task-tags" placeholder="Tags (comma separated)">
                    </div>

                    <p class="weight-hint" id="weight-hint"></p>

                    <div class="task-filters">
                        <input type="search" id="task-search" placeholder="Search tasks...">
                        <select id="assignee-filter">
                            <option value="">All assignees</option>
                        </select>
                    </div>

                    <div class="assignee-summary" id="assignee-summary"></div>

                    <div class="board-columns" id="board-columns">
                        <div class="column" data-status="todo">
                            <h3>To Do</h3>
                        </div>
                        <div class="column" data-status="in_progress">
                            <h3>In Progress</h3>
                        </div>
                        <div class="column" data-status="done">
                            <h3>Done</h3>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button type="button" id="export-json">Export JSON</button>
                        <label class="import-label">
                            Import JSON
                            <input type="file" id="import-json" accept=".json" hidden>
                        </label>
                        <button type="button" id="reset-data" class="btn-reset">Reset data</button>
                    </div>
                </section>
            </article>
        </main>
        <footer class="dp-flex ai-center jc-center">
            <p>
                &copy; 2026 Garage. All rights reserved.
                <a href="https://github.com/fouadsgarage" target="_blank" rel="noopener">github.com/fouadsgarage</a>
            </p>
        </footer>
        <dialog class="dialog" id="dialog">
            <p class="dialog-message" id="dialog-message"></p>
            <div class="dialog-actions" id="dialog-actions"></div>
        </dialog>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage</title>

    <link rel="stylesheet" href="dashboard/assets/stylesheets/style.css">

    <script src="dashboard/assets/engines/engine.js" defer></script>
</head>
<body>
    <header class="dp-flex ai-center">
        <div class="brandmark">
            <h1>Terminal</h1>
        </div>
        <nav class="dp-flex ai-center">
            <a href="" class="dp-flex ai-center jc-center" id="share-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Share
            </a>
        </nav>
    </header>
    <main>
        <article>
            <section class="terminal">
                <div class="terminal-body" id="terminal-body">
                    <p class="line">Garage Terminal v1.0.0</p>
                    <p class="line">Type <code>help</code> to see available commands.</p>
                </div>
                <form class="terminal-input" id="terminal-form">
                    <span class="prompt">&gt;</span>
                    <input
                        type="text"
                        name="commandline"
                        id="commandline"
                        placeholder="help"
                        autocomplete="off"
                        spellcheck="false"
                        autofocus
                    >
                </form>
            </section>
        </article>
        <!-- <aside></aside> -->
    </main>
    <footer></footer>
</body>
</html>
